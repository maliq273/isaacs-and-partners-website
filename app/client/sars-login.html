<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SARS Compliance Portal | Isaacs & Partners</title><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../css/login.css"><link rel="stylesheet" href="../css/login-roles.css?v=20261005"></head>
<body class="login-page"><main class="login-shell"><section class="login-card"><header class="login-brand"><a class="login-home-logo" href="/index.html"><img src="../../assets/logo.png" alt="Isaacs & Partners"></a><h1>SARS Compliance Portal</h1><p>Employer reconciliation, BRS validation and statutory payroll records</p></header><div class="login-message" id="status">Access is controlled by the Isaacs & Partners payroll/SARS service entitlement.</div><form id="form" class="login-form"><div class="login-message error" id="error" hidden></div><div class="login-field"><label for="email">Business account email</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="login-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button id="button" class="login-submit" type="submit">Sign in to SARS Compliance</button></form><p class="login-footer"><a href="/app/client/dashboard.html">← Return to Customer Portal</a></p></section></main>
<script type="module">
import auth from "../auth/AuthService.js";import {resolveUserDashboardRole} from "../dashboard/DashboardAccess.js";import {ensureSupabaseSession} from "../services/SupabaseBrowserClient.js";
const form=document.querySelector("#form"),btn=document.querySelector("#button"),err=document.querySelector("#error");const show=x=>{err.textContent=x||"";err.hidden=!x};await auth.initialise();
async function enter(){const role=await resolveUserDashboardRole(auth.getCurrentUser());if(role!=="BUSINESS")throw new Error("SARS Compliance is available to authorised Business accounts.");const sb=await ensureSupabaseSession(auth);const q=await sb.from("client_service_entitlements").select("status,access_state").eq("business_id",(await sb.from("businesses").select("id").eq("owner_user_id",auth.getCurrentUser().id).eq("is_active",true).limit(1).maybeSingle()).data?.id||"").eq("service_code","HR-SARS").maybeSingle();if(q.error)throw q.error;if(!q.data||q.data.status!=="ACTIVE"||q.data.access_state==="LOCKED")throw new Error("SARS Compliance access is not active for this business. Anthony or Super Admin must activate the HR-SARS service entitlement.");location.replace("/app/client/dashboard.html?workspace=sars");}
if(auth.isAuthenticated())enter().catch(e=>show(e.message));form.addEventListener("submit",async e=>{e.preventDefault();show("");btn.disabled=true;try{const fd=new FormData(form);const r=await auth.login(String(fd.get("email")||"").trim(),String(fd.get("password")||""),{rememberMe:false});if(!r?.authenticated)throw new Error("Authentication failed.");await enter()}catch(e){show(e.message||"Unable to sign in.")}finally{btn.disabled=false}});
</script></body></html>
