<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Client Login | Isaacs & Partners</title>

    <meta
        name="description"
        content="Secure client portal login for Isaacs and Partners."
    >

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body class="client-login">

    <main class="ip-auth-page">

        <section class="ip-auth-card">

            <div class="ip-auth-card__brand">
                <img
                    src="../images/brand-ip-square.png"
                    alt="Isaacs and Partners"
                >

                <span>
                    Isaacs &amp; Partners
                </span>
            </div>

            <div class="ip-auth-card__header">
                <span class="ip-page__eyebrow">
                    Secure Client Portal
                </span>

                <h1>Sign in</h1>

                <p>
                    Enter your credentials to access your
                    matters and documents.
                </p>
            </div>

            <div
                class="ip-alert ip-alert--error"
                data-login-error
                role="alert"
                hidden
            ></div>

            <form
                id="client-login-form"
                data-client-login
                autocomplete="on"
            >

                <div class="ip-form-group">
                    <label for="login-identifier">
                        Passport / ID Number
                    </label>

                    <input
                        id="login-identifier"
                        name="identifier"
                        type="text"
                        autocomplete="username"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="ip-form-group">
                    <label for="login-matter">
                        Matter Number
                    </label>

                    <input
                        id="login-matter"
                        name="matterNumber"
                        type="text"
                        autocomplete="off"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="ip-form-group">
                    <label for="login-password">
                        Password
                    </label>

                    <input
                        id="login-password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="ip-button ip-button--primary ip-button--full"
                    data-login-submit
                >
                    Sign in securely
                </button>

            </form>

            <div class="ip-auth-card__links">
                <a href="mailto:info@isaacsandpartners.online">
                    Contact Isaacs &amp; Partners
                </a>
            </div>

            <p class="ip-auth-card__security-note">
                Your information is handled through the secure
                client portal. Do not share your login credentials
                with another person.
            </p>

        </section>

    </main>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
