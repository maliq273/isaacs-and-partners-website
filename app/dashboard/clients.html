<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Clients | Isaacs and Partners</title>
  <link rel="stylesheet" href="../css/app.css?v=20260827-2">
  <link rel="stylesheet" href="../css/dashboard.css?v=20260827-2">
</head>
<body data-page="clients-dashboard">
  <main class="dashboard-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">Control Plane · Client Management</p>
        <h1>Clients</h1>
        <p class="page-description">Live individual and business client records. Supabase remains the authoritative source of truth.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn btn-secondary" data-client-action="refresh">Refresh</button>
        <button type="button" class="btn btn-secondary" data-client-action="export">Export CSV</button>
        <button type="button" class="btn btn-primary" data-client-action="new">+ Add Individual</button>
        <button type="button" class="btn" data-auth-action="logout">Sign Out</button>
      </div>
    </header>

    <div id="client-message" class="login-message" role="status" hidden></div>

    <section class="stats-grid">
      <article class="stat-card"><span class="stat-label">Total Clients</span><strong id="total-clients">0</strong></article>
      <article class="stat-card"><span class="stat-label">Active Clients</span><strong id="active-clients">0</strong></article>
      <article class="stat-card"><span class="stat-label">New This Month</span><strong id="new-clients-month">0</strong></article>
      <article class="stat-card"><span class="stat-label">Data Source</span><strong>LIVE</strong></article>
    </section>

    <section class="panel">
      <div class="panel-toolbar">
        <div class="search-box" style="flex:1">
          <label for="client-search" class="sr-only">Search clients</label>
          <input id="client-search" type="search" class="form-control" placeholder="Search name, email, phone or registration number..." autocomplete="off">
        </div>
        <select id="client-status-filter" class="form-control">
          <option value="">All statuses</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <select id="client-department-filter" class="form-control" disabled title="Department filtering will be enabled when matter-to-client department data is available.">
          <option value="">All departments</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table>
          <thead><tr><th>Client</th><th>Type</th><th>Contact</th><th>Reference</th><th>Status</th><th>Updated</th><th>Actions</th><th></th></tr></thead>
          <tbody id="clients-table"><tr><td colspan="8">Loading live clients...</td></tr></tbody>
        </table>
      </div>
      <div id="clients-pagination" class="pagination"></div>
    </section>
  </main>

  <div id="client-modal" class="modal-host" hidden></div>

  <script type="module">
    import controller from "./ClientsController.js?v=20260827-1";
    await controller.initialise();
  </script>
</body>
</html>
