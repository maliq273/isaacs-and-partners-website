<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Reports | Isaacs and Partners</title>
  <link rel="stylesheet" href="../css/app.css">
</head>

<body data-page="reports-dashboard">
  <div id="app-shell"></div>

  <main class="dashboard-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">Reporting</p>
        <h1>Reports</h1>
        <p class="page-description">
          Generate, view and export operational, financial and matter reports.
        </p>
      </div>
    </header>

    <section class="dashboard-grid">
      <article class="panel">
        <div class="panel-header">
          <h2>Generate Report</h2>
        </div>

        <form id="report-form" class="form-grid">
          <div class="form-group">
            <label for="report-type">Report Type</label>
            <select id="report-type" name="reportType" class="form-control" required>
              <option value="">Select report</option>
              <option value="matter-summary">Matter Summary</option>
              <option value="client-summary">Client Summary</option>
              <option value="financial">Financial Report</option>
              <option value="department-performance">Department Performance</option>
              <option value="staff-performance">Staff Performance</option>
              <option value="document-outstanding">Outstanding Documents</option>
              <option value="workflow-performance">Workflow Performance</option>
              <option value="ai-risk">AI Risk Report</option>
              <option value="audit">Audit Report</option>
            </select>
          </div>

          <div class="form-group">
            <label for="report-start-date">Start Date</label>
            <input
              id="report-start-date"
              name="startDate"
              type="date"
              class="form-control"
            >
          </div>

          <div class="form-group">
            <label for="report-end-date">End Date</label>
            <input
              id="report-end-date"
              name="endDate"
              type="date"
              class="form-control"
            >
          </div>

          <div class="form-group">
            <label for="report-format">Format</label>
            <select id="report-format" name="format" class="form-control">
              <option value="pdf">PDF</option>
              <option value="xlsx">Excel</option>
              <option value="csv">CSV</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              Generate Report
            </button>
          </div>
        </form>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Quick Reports</h2>
        </div>

        <div class="quick-actions">
          <button class="quick-action" data-report="matter-summary">
            Matter Summary
          </button>

          <button class="quick-action" data-report="financial">
            Financial Report
          </button>

          <button class="quick-action" data-report="document-outstanding">
            Outstanding Documents
          </button>

          <button class="quick-action" data-report="ai-risk">
            AI Risk Report
          </button>
        </div>
      </article>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2>Generated Reports</h2>
          <p>Previously generated reports and exports.</p>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Report</th>
              <th>Type</th>
              <th>Format</th>
              <th>Status</th>
              <th>Generated By</th>
              <th>Generated</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="reports-table">
            <tr>
              <td colspan="7">Loading reports...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
