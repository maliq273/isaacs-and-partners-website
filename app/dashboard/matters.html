<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Matters | Isaacs and Partners</title>
  <link rel="stylesheet" href="../css/app.css">
</head>

<body data-page="matters-dashboard">
  <div id="app-shell"></div>

  <main class="dashboard-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">Matter Management</p>
        <h1>Matters</h1>
        <p class="page-description">
          Monitor every active and completed client matter.
        </p>
      </div>

      <div class="page-actions">
        <button type="button" class="btn btn-secondary" id="export-matters">
          Export
        </button>

        <button type="button" class="btn btn-primary" id="create-matter">
          New Matter
        </button>
      </div>
    </header>

    <section class="stats-grid">
      <article class="stat-card">
        <span class="stat-label">Total Matters</span>
        <strong id="total-matters">0</strong>
      </article>

      <article class="stat-card">
        <span class="stat-label">Open</span>
        <strong id="open-matters">0</strong>
      </article>

      <article class="stat-card">
        <span class="stat-label">High Priority</span>
        <strong id="high-priority-matters">0</strong>
      </article>

      <article class="stat-card">
        <span class="stat-label">Overdue Tasks</span>
        <strong id="overdue-matter-tasks">0</strong>
      </article>
    </section>

    <section class="panel">
      <div class="panel-toolbar">
        <input
          id="matter-search"
          type="search"
          class="form-control"
          placeholder="Search matter reference, client or title..."
          autocomplete="off"
        >

        <select id="matter-department-filter" class="form-control">
          <option value="">All departments</option>
          <option value="immigration">Immigration</option>
          <option value="hr-ir">HR & Industrial Relations</option>
          <option value="business-compliance">Business Compliance</option>
          <option value="legal">Legal Services</option>
        </select>

        <select id="matter-status-filter" class="form-control">
          <option value="">All statuses</option>
          <option value="open">Open</option>
          <option value="active">Active</option>
          <option value="pending">Pending</option>
          <option value="closed">Closed</option>
          <option value="completed">Completed</option>
        </select>

        <select id="matter-priority-filter" class="form-control">
          <option value="">All priorities</option>
          <option value="low">Low</option>
          <option value="normal">Normal</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Reference</th>
              <th>Client</th>
              <th>Title</th>
              <th>Department</th>
              <th>Stage</th>
              <th>Status</th>
              <th>Priority</th>
              <th>Assigned To</th>
              <th>Updated</th>
            </tr>
          </thead>

          <tbody id="matters-table">
            <tr>
              <td colspan="9">Loading matters...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pagination" id="matters-pagination"></div>
    </section>
  </main>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
