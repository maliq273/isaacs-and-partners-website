<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Isaacs & Partners - Document Upload
    </title>

    <!-- =====================================================
         FUTURE INSERT
         Authentication / Client Portal Security
         ===================================================== -->

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

</head>

<body>

    <main class="upload-page">

        <section
            class="upload-container"
            aria-labelledby="upload-title"
        >

            <header>

                <h1 id="upload-title">
                    Upload Documents
                </h1>

                <p>
                    Upload documents required for your matter.
                </p>

            </header>

            <!-- =================================================
                 FUTURE INSERT
                 Matter reference information
                 Client information
                 ================================================= -->

            <section
                id="upload-checklist"
                aria-label="Document checklist"
            >

                <!-- Checklist generated by JavaScript -->

            </section>

            <section
                class="upload-area"
                aria-label="Document upload"
            >

                <label
                    for="document-upload"
                >
                    Select Documents
                </label>

                <input
                    id="document-upload"
                    type="file"
                    multiple
                    accept="
                        application/pdf,
                        image/jpeg,
                        image/png,
                        application/msword,
                        application/vnd.openxmlformats-officedocument.wordprocessingml.document
                    "
                >

                <p>
                    Accepted documents include PDF,
                    Word documents and images.
                </p>

            </section>

            <section
                id="upload-preview"
                aria-label="Document preview"
            >

                <!-- Preview generated by JavaScript -->

            </section>

            <section
                id="upload-status"
                aria-live="polite"
            >

                <!-- Upload status -->

            </section>

            <!-- =================================================
                 FUTURE INSERT
                 AI document matching
                 =================================================

                 Uploaded document
                        ↓
                 AI classification
                        ↓
                 Checklist match
                        ↓
                 User confirmation
                        ↓
                 Document repository
                 ================================================= -->

        </section>

    </main>

    <script
        type="module"
        src="./upload.js"
    ></script>

</body>

</html>
