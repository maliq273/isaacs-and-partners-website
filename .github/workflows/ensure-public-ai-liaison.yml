name: Ensure public AI Liaison is wired

on:
  push:
    branches: [main]
    paths:
      - 'app/communication/public/PublicLeadLiaison.js'
      - 'app/communication/public/PublicLeadLiaisonBootstrap.js'
      - 'app/communication/agents/PublicLeadResponseGenerator.js'
      - 'app/communication/public/PublicServiceDirectory.js'
      - 'app/css/public-ai-liaison.css'
      - 'app/css/public-ai-liaison-layout-fix.css'
      - 'index.html'
      - 'script.js'
      - 'app/auth/login.html'
      - 'app/auth/register.html'
      - 'app/consultation/index.html'
      - '404.html'
      - '.github/workflows/ensure-public-ai-liaison.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Normalize all website logo references
        shell: python
        run: |
          from pathlib import Path

          canonical = "assets/logo.png"

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in {".html", ".js", ".css", ".json", ".xml", ".txt"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              updated = text
              updated = updated.replace("assets/logo%20.png", canonical)
              updated = updated.replace("assets/logo .png", canonical)
              updated = updated.replace("images/logo.png", canonical)

              if path.as_posix().startswith("app/auth/"):
                  updated = updated.replace("../../assets/logo%20.png", "../../assets/logo.png")
                  updated = updated.replace("../../assets/logo .png", "../../assets/logo.png")
              elif path.as_posix().startswith("app/consultation/"):
                  updated = updated.replace("../assets/logo%20.png", "../assets/logo.png")
                  updated = updated.replace("../assets/logo .png", "../assets/logo.png")

              if updated != text:
                  path.write_text(updated, encoding="utf-8")

      - name: Wire homepage runtime and public AI Liaison
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")

          lines = text.splitlines(True)
          lines = [
              line for line in lines
              if 'rel="preload"' not in line or 'as="image"' not in line or 'assets/logo' not in line
          ]
          text = "".join(lines)

          preload = '    <link rel="preload" as="image" href="assets/logo.png" fetchpriority="high">\n'
          if 'rel="preload" as="image" href="assets/logo.png"' not in text:
              text = text.replace("</head>", preload + "</head>", 1)

          css = '    <link rel="stylesheet" href="app/css/public-ai-liaison.css?v=20260906-ai">\n'
          js = '    <script type="module" src="app/communication/public/PublicLeadLiaison.js?v=20260906-ai"></script>\n'
          bootstrap = '    <script type="module" src="app/communication/public/PublicLeadLiaisonBootstrap.js?v=20260906-ai"></script>\n'

          if 'app/css/public-ai-liaison.css' not in text:
              text = text.replace("</head>", css + "</head>", 1)
          else:
              text = text.replace('href="app/css/public-ai-liaison.css"', 'href="app/css/public-ai-liaison.css?v=20260906-ai"')

          if 'app/communication/public/PublicLeadLiaison.js' not in text:
              text = text.replace("</body>", js + "</body>", 1)
          else:
              text = text.replace('src="app/communication/public/PublicLeadLiaison.js"', 'src="app/communication/public/PublicLeadLiaison.js?v=20260906-ai"')

          if 'app/communication/public/PublicLeadLiaisonBootstrap.js' not in text:
              text = text.replace("</body>", bootstrap + "</body>", 1)

          text = text.replace('script.js?v=20260822', 'script.js?v=20260906')
          index.write_text(text, encoding="utf-8")

          runtime = Path("script.js")
          runtime_text = runtime.read_text(encoding="utf-8")
          bootstrap_runtime = '''\n/* =====================================================\n   PUBLIC AI LIAISON BOOTSTRAP\n   ===================================================== */\n\n(function initialisePublicAILiaisonRuntime() {\n    const boot = () => {\n        if (window.__IP_PUBLIC_AI_LIAISON_BOOT_REQUESTED__) return;\n        window.__IP_PUBLIC_AI_LIAISON_BOOT_REQUESTED__ = true;\n        import("./app/communication/public/PublicLeadLiaisonBootstrap.js?v=20260906-ai")\n            .catch(error => console.error("[Public AI Liaison] bootstrap import failed", error));\n    };\n\n    if (document.readyState === "loading") {\n        document.addEventListener("DOMContentLoaded", boot, { once: true });\n    } else {\n        boot();\n    }\n})();\n'''
          if 'PublicLeadLiaisonBootstrap.js?v=20260906-ai' not in runtime_text:
              runtime.write_text(runtime_text.rstrip() + bootstrap_runtime, encoding="utf-8")

      - name: Verify canonical logo and AI wiring
        shell: bash
        run: |
          test -f assets/logo.png
          test -f app/css/public-ai-liaison.css
          test -f app/css/public-ai-liaison-layout-fix.css
          test -f app/communication/public/PublicLeadLiaison.js
          test -f app/communication/public/PublicLeadLiaisonBootstrap.js
          test -f script.js
          ! grep -R --exclude-dir=.git --exclude-dir=.github -n 'assets/logo%20.png\|assets/logo \.png' . || (echo 'Old spaced/encoded logo reference remains' && exit 1)
          ! grep -R --exclude-dir=.git --exclude-dir=.github -n 'images/logo.png' . || (echo 'Deleted images/logo.png reference remains' && exit 1)
          grep -n 'assets/logo.png' index.html
          grep -n 'app/css/public-ai-liaison.css' index.html
          grep -n 'app/communication/public/PublicLeadLiaison.js' index.html
          grep -n 'app/communication/public/PublicLeadLiaisonBootstrap.js' index.html
          grep -n 'script.js?v=20260906' index.html
          grep -n 'PublicLeadLiaisonBootstrap.js?v=20260906-ai' script.js

      - name: Commit canonical wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated wiring changes required."
            exit 0
          fi
          git commit -m "Harden public AI Liaison wiring and cache bust"
          git push origin main
