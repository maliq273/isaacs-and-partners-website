name: Ensure public AI Liaison is wired

on:
  push:
    branches: [main]
    paths:
      - 'app/communication/public/PublicLeadLiaison.js'
      - 'app/communication/agents/PublicLeadResponseGenerator.js'
      - 'app/communication/public/PublicServiceDirectory.js'
      - 'app/css/public-ai-liaison.css'
      - 'index.html'
      - 'app/auth/login.html'
      - 'app/auth/register.html'
      - 'app/consultation/index.html'
      - '.github/workflows/ensure-public-ai-liaison.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Normalize all website logo references
        shell: python
        run: |
          from pathlib import Path

          # Canonical public brand asset.
          # The repository now contains assets/logo.png.
          canonical = "assets/logo.png"
          replacements = {
              "assets/logo%20.png": canonical,
              "assets/logo .png": canonical,
              "images/logo.png": canonical,
              "../assets/logo.png": "../assets/logo.png",
              "../../assets/logo.png": "../../assets/logo.png",
          }

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in {".html", ".js", ".css", ".json", ".xml", ".txt"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              updated = text
              for old, new in replacements.items():
                  if old.startswith("../"):
                      continue
                  updated = updated.replace(old, new)

              # Fix relative application pages separately so their path remains valid.
              if path.as_posix().startswith("app/auth/") or path.as_posix().startswith("app/consultation/"):
                  updated = updated.replace("../../assets/logo%20.png", "../../assets/logo.png")
                  updated = updated.replace("../../assets/logo .png", "../../assets/logo.png")
                  updated = updated.replace("../../assets/logo.png", "../../assets/logo.png")
                  updated = updated.replace("../assets/logo%20.png", "../assets/logo.png")
                  updated = updated.replace("../assets/logo .png", "../assets/logo.png")

              if updated != text:
                  path.write_text(updated, encoding="utf-8")

      - name: Wire homepage preload and public AI Liaison
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")

          # Remove old/duplicate preloads and insert one canonical logo preload.
          lines = text.splitlines(True)
          lines = [
              line for line in lines
              if 'rel="preload"' not in line or 'as="image"' not in line or 'assets/logo' not in line
          ]
          text = "".join(lines)

          preload = '    <link rel="preload" as="image" href="assets/logo.png" fetchpriority="high">\n'
          if 'rel="preload" as="image" href="assets/logo.png"' not in text:
              text = text.replace("</head>", preload + "</head>", 1)

          css = '    <link rel="stylesheet" href="app/css/public-ai-liaison.css">\n'
          js = '    <script type="module" src="app/communication/public/PublicLeadLiaison.js"></script>\n'

          if 'app/css/public-ai-liaison.css' not in text:
              text = text.replace("</head>", css + "</head>", 1)
          if 'app/communication/public/PublicLeadLiaison.js' not in text:
              text = text.replace("</body>", js + "</body>", 1)

          index.write_text(text, encoding="utf-8")

      - name: Verify canonical logo references
        shell: bash
        run: |
          test -f assets/logo.png
          ! grep -R --exclude-dir=.git -n 'assets/logo%20.png\|assets/logo \.png' . || (echo 'Old spaced/encoded logo reference remains' && exit 1)
          ! grep -R --exclude-dir=.git -n 'images/logo.png' . || (echo 'Deleted images/logo.png reference remains' && exit 1)
          grep -n 'assets/logo.png' index.html
          grep -n 'app/communication/public/PublicLeadLiaison.js' index.html

      - name: Commit canonical wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app/auth/login.html app/auth/register.html app/consultation/index.html
          if git diff --cached --quiet; then
            echo "No generated wiring changes required."
            exit 0
          fi
          git commit -m "Fix canonical logo paths and wire public AI"
          git push origin main
