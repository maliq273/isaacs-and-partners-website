name: Ensure public AI Liaison is wired

on:
  push:
    branches: [main]
    paths:
      - 'app/communication/public/PublicLeadLiaison.js'
      - 'app/css/public-ai-liaison.css'
      - 'index.html'
      - '.github/workflows/ensure-public-ai-liaison.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire public AI Liaison into index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          css = '    <link rel="stylesheet" href="app/css/public-ai-liaison.css">\n'
          js = '    <script type="module" src="app/communication/public/PublicLeadLiaison.js"></script>\n'

          if 'app/css/public-ai-liaison.css' not in text:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('index.html is missing </head>')
              text = text.replace(marker, css + marker, 1)

          if 'app/communication/public/PublicLeadLiaison.js' not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html is missing </body>')
              text = text.replace(marker, js + marker, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit generated index wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Public AI Liaison already wired."
            exit 0
          fi
          git commit -m "Wire public AI Liaison into index"
          git push
