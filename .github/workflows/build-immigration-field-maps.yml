name: Build immigration PDF field maps

on:
  push:
    paths:
      - "immigrations_docs/**"
      - ".github/workflows/build-immigration-field-maps.yml"
      - "scripts/build_immigration_field_maps.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-field-maps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pypdf==6.16.1
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Build field maps from original PDFs
        run: python scripts/build_immigration_field_maps.py

      - name: Commit generated field maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/knowledgebase/immigration_docs/field-maps
          git diff --cached --quiet && exit 0
          git commit -m "Build actual immigration PDF field maps"
          git push
